blueprint:
  name: Luz Adaptativa Inteligente Pro (Script)
  description: |-
    Script avanzado que enciende luces con brillo y temperatura adaptados a la hora del día.
    
    Características:
    • Control adaptativo basado en 4 períodos del día
    • Modo "Visitas" para encendido simple sin ajustes
    • Transiciones suaves configurables
    • Soporte para luces RGB y temperatura de color
    
  domain: script

  input:
    # Configuración Principal
    target_light:
      name: Luz a controlar
      description: Selecciona la luz que será controlada por este script
      selector:
        entity:
          domain: light

    modo_visitas_helper:
      name: Ayudante "Modo Visitas"
      description: Input boolean para activar el modo visitas
      selector:
        entity:
          domain: input_boolean
      default: input_boolean.modo_visitas

    transition_time:
      name: Tiempo de transición (segundos)
      description: Duración del fade-in al encender
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: "s"
          mode: slider
      default: 3

    # MAÑANA (6:00 - 8:59)
    morning_brightness:
      name: Mañana - Brillo
      description: Brillo para las mañanas (6:00-8:59)
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
      default: 75

    morning_temp:
      name: Mañana - Temperatura de color
      description: Temperatura en Kelvin (6:00-8:59)
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: "K"
          mode: slider
      default: 4500

    # DÍA (9:00 - 17:59)
    day_brightness:
      name: Día - Brillo
      description: Brillo durante el día (9:00-17:59)
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
      default: 100

    day_temp:
      name: Día - Temperatura de color
      description: Temperatura en Kelvin (9:00-17:59)
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: "K"
          mode: slider
      default: 5500

    # TARDE (18:00 - 21:59)
    evening_brightness:
      name: Tarde - Brillo
      description: Brillo para la tarde (18:00-21:59)
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
      default: 60

    evening_temp:
      name: Tarde - Temperatura de color
      description: Temperatura en Kelvin (18:00-21:59)
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: "K"
          mode: slider
      default: 3000

    # NOCHE (22:00 - 5:59)
    night_brightness:
      name: Noche - Brillo
      description: Brillo para la noche (22:00-5:59)
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
      default: 20

    night_temp:
      name: Noche - Temperatura de color
      description: Temperatura en Kelvin (22:00-5:59)
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: "K"
          mode: slider
      default: 2200

sequence:
  - choose:
      # MODO VISITAS ACTIVADO
      - conditions:
          - condition: state
            entity_id: !input modo_visitas_helper
            state: "on"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_light
            data:
              transition: !input transition_time

    # MODO NORMAL (ADAPTATIVO)
    default:
      - choose:
          # MAÑANA (6:00 - 8:59)
          - conditions:
              - condition: template
                value_template: "{{ 6 <= now().hour < 9 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  brightness_pct: !input morning_brightness
                  kelvin: !input morning_temp
                  transition: !input transition_time

          # DÍA (9:00 - 17:59)
          - conditions:
              - condition: template
                value_template: "{{ 9 <= now().hour < 18 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  brightness_pct: !input day_brightness
                  kelvin: !input day_temp
                  transition: !input transition_time

          # TARDE (18:00 - 21:59)
          - conditions:
              - condition: template
                value_template: "{{ 18 <= now().hour < 22 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  brightness_pct: !input evening_brightness
                  kelvin: !input evening_temp
                  transition: !input transition_time

        # NOCHE (22:00 - 5:59) - Default
        default:
          - service: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: !input night_brightness
              kelvin: !input night_temp
              transition: !input transition_time

mode: parallel
max: 10